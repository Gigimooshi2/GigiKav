name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Use fixed signing key
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/GigiKav-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
